syntax = "proto3";

package crossrefd.crossref.v1;

import "amino/amino.proto";
import "crossrefd/crossref/v1/packet.proto";
import "crossrefd/crossref/v1/params.proto";
import "crossrefd/crossref/v1/history.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/crossref/crossrefd/x/crossref/types";

// GenesisState defines the crossref module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string port_id = 2;
  repeated CrossReferenceAck cross_reference_acks = 3 [(gogoproto.nullable) = false];
  repeated TrustedLightClientState trusted_light_client_states = 4 [(gogoproto.nullable) = false];
  repeated LightClientUpdate light_client_updates = 5 [(gogoproto.nullable) = false];
  HistoryState history_state = 6;
  repeated HistoryRound history_rounds = 7 [(gogoproto.nullable) = false];
  repeated DomainInfo domains = 8 [(gogoproto.nullable) = false];
  repeated DomainChannel domain_channels = 9 [(gogoproto.nullable) = false];
}
